<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Project Atlas">
  <title>Project Atlas</title>
  <defs>
    <linearGradient id="bg" x1="20" y1="12" x2="108" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="64" y1="38" x2="64" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bg)"/>

  <!-- ring -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="#38BDF8" stroke-width="5" stroke-opacity="0.95"/>

  <!-- north needle (bright) -->
  <path d="M64 38 L73 64 L64 70 L55 64 Z" fill="url(#accent)"/>
  <!-- south needle (dim) -->
  <path d="M64 90 L55 64 L64 58 L73 64 Z" fill="#38BDF8" fill-opacity="0.35"/>

  <!-- hub -->
  <circle cx="64" cy="64" r="4" fill="#0B1220"/>
</svg>
